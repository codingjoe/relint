[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.12", "flit-scm", "wheel" ]

[project]
name = "relint"
readme = "README.md"
keywords = [ "linter", "regex" ]
license = { file = "LICENSE" }
authors = [
  { name = "Johannes Maron", email = "johannes@maron.family" },
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dynamic = [ "description", "version" ]
dependencies = [
  "pyyaml",
  "rich",
]
optional-dependencies.regex = [ "regex" ]
urls.Changelog = "https://github.com/codingjoe/relint/releases"
urls.Project-URL = "https://github.com/codingjoe/relint"
scripts.relint = "relint.__main__:main"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-mock",
]

[tool.setuptools_scm]
write_to = "relint/_version.py"

[tool.flit]
module.name = "relint"

[tool.ruff]
src = [ "relint", "tests" ]
lint.select = [
  "B",  # flake8-bugbear
  "C",  # flake8-comprehensions
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "S",  # flake8-bandit
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]
lint.ignore = [ "B904", "D1", "E501", "S101" ]
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
lint.isort.split-on-trailing-comma = true
lint.pydocstyle.convention = "pep257"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "--cov --tb=short -rxs"

[tool.coverage]
run.source = [ "relint" ]
report.show_missing = true
